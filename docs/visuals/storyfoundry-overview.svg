<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">StoryFoundry product overview</title><desc id="desc">A synthetic business story flows through a canonical model into five offline CRM adapter exports.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#182b3d"/></linearGradient><linearGradient id="accent"><stop stop-color="#55d6be"/><stop offset="1" stop-color="#7aa7ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter></defs>
  <rect width="1400" height="820" fill="url(#bg)"/><circle cx="1220" cy="80" r="260" fill="#55d6be" opacity=".06"/><circle cx="110" cy="760" r="300" fill="#7aa7ff" opacity=".05"/>
  <text x="84" y="92" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="700">StoryFoundry</text><text x="86" y="138" fill="#a8bdc9" font-family="Inter,Arial,sans-serif" font-size="23">Coherent fictional businesses · portable records · reviewable offline imports</text>
  <g filter="url(#shadow)"><rect x="84" y="210" width="330" height="430" rx="24" fill="#fff"/><rect x="462" y="170" width="440" height="510" rx="24" fill="#fff"/><rect x="950" y="210" width="366" height="430" rx="24" fill="#fff"/></g>
  <g font-family="Inter,Arial,sans-serif"><text x="120" y="270" fill="#152437" font-size="28" font-weight="700">1 · Generate</text><text x="120" y="314" fill="#557080" font-size="18">Seeded scenario inputs</text><path d="M120 355h250M120 390h190M120 425h220" stroke="#d5e3e8" stroke-width="16" stroke-linecap="round"/><circle cx="150" cy="515" r="46" fill="#e1faf5"/><text x="150" y="524" text-anchor="middle" fill="#167d6d" font-size="22" font-weight="700">38</text><text x="220" y="510" fill="#152437" font-size="18" font-weight="700">domains</text><text x="220" y="540" fill="#557080" font-size="16">relationships + chronology</text><circle cx="150" cy="590" r="46" fill="#e9efff"/><text x="150" y="599" text-anchor="middle" fill="#4265be" font-size="22" font-weight="700">21.9k</text><text x="220" y="585" fill="#152437" font-size="18" font-weight="700">records</text><text x="220" y="615" fill="#557080" font-size="16">fictional, marked synthetic</text>
  <text x="505" y="235" fill="#152437" font-size="28" font-weight="700">2 · Canonical story</text><text x="505" y="279" fill="#557080" font-size="18">JSONL source of truth</text><g fill="#eaf7f4" stroke="#55d6be"><rect x="505" y="325" width="165" height="55" rx="12"/><rect x="690" y="325" width="165" height="55" rx="12"/><rect x="505" y="405" width="165" height="55" rx="12"/><rect x="690" y="405" width="165" height="55" rx="12"/><rect x="505" y="485" width="165" height="55" rx="12"/><rect x="690" y="485" width="165" height="55" rx="12"/></g><g fill="#19594f" font-size="17" text-anchor="middle"><text x="587" y="359">accounts</text><text x="772" y="359">contacts</text><text x="587" y="439">opportunities</text><text x="772" y="439">projects + tasks</text><text x="587" y="519">invoices + payments</text><text x="772" y="519">support + knowledge</text></g><text x="505" y="605" fill="#557080" font-size="16">Validated: foreign keys · dates · money · DAGs</text>
  <text x="990" y="270" fill="#152437" font-size="28" font-weight="700">3 · Export offline</text><text x="990" y="314" fill="#557080" font-size="18">No credentials. No writes.</text><g fill="#eef2ff" stroke="#7aa7ff"><rect x="990" y="355" width="282" height="42" rx="10"/><rect x="990" y="415" width="282" height="42" rx="10"/><rect x="990" y="475" width="282" height="42" rx="10"/><rect x="990" y="535" width="282" height="42" rx="10"/></g><g fill="#2f4f9d" font-size="17"><text x="1012" y="382">Salesforce · CSV / JSON</text><text x="1012" y="442">HubSpot · CSV / JSON</text><text x="1012" y="502">Dynamics · CSV / JSON</text><text x="1012" y="562">Zoho · CSV / JSON · Pipedrive</text></g><text x="990" y="615" fill="#557080" font-size="16">Target configuration remains required</text></g>
  <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M414 425h48"/><path d="M902 425h48"/></g><g fill="#55d6be"><path d="M452 425l-13-10v20z"/><path d="M938 425l-13-10v20z"/></g>
  <text x="84" y="752" fill="#a8bdc9" font-family="Inter,Arial,sans-serif" font-size="18">Deterministic facts govern · model prose is optional fiction · native CRM acceptance is not claimed</text>
</svg>
