<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">StoryFoundry adapter boundary</title><desc id="desc">Five offline adapters map three canonical object families while the remaining domains stay unmapped.</desc><rect width="1400" height="760" fill="#102336"/><text x="80" y="82" fill="#fff" font-family="Inter,Arial" font-size="42" font-weight="700">Adapter boundary</text><text x="82" y="122" fill="#a8bdc9" font-family="Inter,Arial" font-size="20">Implemented means offline file export — not native CRM import</text><g font-family="Inter,Arial"><rect x="80" y="190" width="360" height="470" rx="20" fill="#fff"/><text x="120" y="245" fill="#102336" font-size="26" font-weight="700">Canonical source</text><text x="120" y="286" fill="#557080" font-size="18">38 domains · JSONL / CSV</text><g fill="#e4faf5"><rect x="120" y="330" width="280" height="54" rx="10"/><rect x="120" y="400" width="280" height="54" rx="10"/><rect x="120" y="470" width="280" height="54" rx="10"/></g><g fill="#19594f" font-size="19"><text x="145" y="364">accounts</text><text x="145" y="434">contacts</text><text x="145" y="504">opportunities</text></g><text x="120" y="585" fill="#557080" font-size="17">35 other domains retained</text><text x="120" y="615" fill="#557080" font-size="17">but explicitly unmapped</text><path d="M440 425h90M870 425h90" stroke="#55d6be" stroke-width="5"/><path d="M530 425l-14-11v22zM960 425l-14-11v22z" fill="#55d6be"/><rect x="540" y="190" width="330" height="470" rx="20" fill="#eaf7f4"/><text x="580" y="245" fill="#102336" font-size="26" font-weight="700">Offline adapter</text><text x="580" y="286" fill="#557080" font-size="18">mapping + sidecar + plan</text><g fill="#fff" stroke="#55d6be"><rect x="580" y="340" width="250" height="50" rx="10"/><rect x="580" y="410" width="250" height="50" rx="10"/><rect x="580" y="480" width="250" height="50" rx="10"/></g><g fill="#19594f" font-size="17"><text x="605" y="371">field prerequisites</text><text x="605" y="441">relationship limits</text><text x="605" y="511">replay / rollback notes</text></g><rect x="970" y="190" width="350" height="470" rx="20" fill="#fff"/><text x="1010" y="245" fill="#102336" font-size="26" font-weight="700">Five outputs</text><text x="1010" y="286" fill="#557080" font-size="18">target configuration required</text><g fill="#eef2ff"><rect x="1010" y="330" width="270" height="42" rx="9"/><rect x="1010" y="390" width="270" height="42" rx="9"/><rect x="1010" y="450" width="270" height="42" rx="9"/><rect x="1010" y="510" width="270" height="42" rx="9"/><rect x="1010" y="570" width="270" height="42" rx="9"/></g><g fill="#2f4f9d" font-size="17"><text x="1030" y="357">Salesforce</text><text x="1030" y="417">HubSpot</text><text x="1030" y="477">Dynamics 365</text><text x="1030" y="537">Zoho CRM</text><text x="1030" y="597">Pipedrive</text></g></g></svg>
