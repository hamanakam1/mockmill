<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">MockMill validation dashboard</title><desc id="desc">Visual summary of deterministic validation checks and the offline-only safety boundary.</desc><rect width="1400" height="820" fill="#f6fafb"/><rect x="0" width="1400" height="150" fill="#102336"/><text x="76" y="78" fill="#fff" font-family="Inter,Arial" font-size="42" font-weight="700">Validation dashboard</text><text x="78" y="118" fill="#a8bdc9" font-family="Inter,Arial" font-size="20">MockMill · synthetic fixture · deterministic evidence</text><g font-family="Inter,Arial"><rect x="76" y="200" width="280" height="150" rx="18" fill="#e4faf5"/><text x="108" y="247" fill="#167d6d" font-size="20" font-weight="700">STATUS</text><text x="108" y="305" fill="#102336" font-size="44" font-weight="700">PASS</text><rect x="390" y="200" width="280" height="150" rx="18" fill="#e9efff"/><text x="422" y="247" fill="#4265be" font-size="20" font-weight="700">RECORDS</text><text x="422" y="305" fill="#102336" font-size="40" font-weight="700">21,923</text><rect x="704" y="200" width="280" height="150" rx="18" fill="#fff1dc"/><text x="736" y="247" fill="#a25d17" font-size="20" font-weight="700">DOMAINS</text><text x="736" y="305" fill="#102336" font-size="44" font-weight="700">38</text><rect x="1018" y="200" width="306" height="150" rx="18" fill="#f0eaff"/><text x="1050" y="247" fill="#6746a8" font-size="20" font-weight="700">BEHAVIORAL TESTS</text><text x="1050" y="305" fill="#102336" font-size="44" font-weight="700">26</text><text x="76" y="420" fill="#102336" font-size="26" font-weight="700">What is verified</text><g fill="#102336" font-size="20"><text x="96" y="475">✓ stable IDs and deterministic replay</text><text x="96" y="520">✓ referential integrity and account containment</text><text x="96" y="565">✓ chronology, status transitions and task DAGs</text><text x="96" y="610">✓ invoice, credit and payment arithmetic</text><text x="96" y="655">✓ reserved contact endpoints and CSV formula safety</text><text x="96" y="700">✓ adapter-specific relationship and replay limits</text></g><rect x="760" y="405" width="564" height="300" rx="18" fill="#fff" stroke="#d6e2e8" stroke-width="2"/><text x="800" y="455" fill="#102336" font-size="24" font-weight="700">Safety boundary</text><text x="800" y="505" fill="#b4574d" font-size="23" font-weight="700">OFFLINE ONLY</text><text x="800" y="550" fill="#557080" font-size="18">No API client · no credentials</text><text x="800" y="585" fill="#557080" font-size="18">No target write · no live import</text><text x="800" y="620" fill="#557080" font-size="18">No native acceptance implied</text><text x="800" y="670" fill="#557080" font-size="16">Configure and authorize a non-production target</text></g></svg>
