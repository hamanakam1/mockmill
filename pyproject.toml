[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockmill"
version = "0.2.0"
description = "Deterministic synthetic business stories and offline CRM fixture adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MockMill contributors" }]
keywords = ["synthetic-data", "crm", "fixtures", "data-generation", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Testing"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hamanakam1/mockmill"
Documentation = "https://github.com/hamanakam1/mockmill/tree/main/docs"
Issues = "https://github.com/hamanakam1/mockmill/issues"

[project.scripts]
mockmill-generate = "generate:main"
mockmill-validate = "validate:main"
mockmill-preview = "import_preview:main"
mockmill-export = "export_crm:main"

[tool.setuptools]
py-modules = ["generate", "validate", "import_preview", "export_crm"]
packages = ["adapters", "inputs", "templates"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.svg"]
