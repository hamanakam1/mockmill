[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyfoundry"
version = "0.1.0"
description = "Deterministic synthetic business stories and offline CRM fixture adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "StoryFoundry contributors" }]
keywords = ["synthetic-data", "crm", "fixtures", "data-generation", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Testing"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hamanakam1/storyfoundry"
Documentation = "https://github.com/hamanakam1/storyfoundry/tree/main/docs"
Issues = "https://github.com/hamanakam1/storyfoundry/issues"

[project.scripts]
storyfoundry-generate = "generate:main"
storyfoundry-validate = "validate:main"
storyfoundry-preview = "import_preview:main"
storyfoundry-export = "export_crm:main"

[tool.setuptools]
py-modules = ["generate", "validate", "import_preview", "export_crm"]
packages = ["adapters", "inputs", "templates"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.svg"]
